services:
  - type: web
    name: finsight
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: LLM_MODEL
        value: claude-opus-5-5
      # Set in the Render dashboard when creating the service (not stored in git)
      - key: POLYGON_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      # No ANTHROPIC_API_KEY: visitors bring their own key in the sidebar
